# Made by ycangignacy
[package]
name = "windowcraft-engine"
description = "Native Windows adapters, transactional snapshots, drift detection and system inspection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
windowcraft-config.workspace = true
rayon.workspace = true
redb.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
windows.workspace = true
windows-collections.workspace = true
# The file converter. Pure Rust except LAME, which the MP3 encoder builds from C.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "qoi", "tga", "pnm"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "adpcm", "isomp4", "mkv", "ogg", "wav", "aiff", "caf"] }
flacenc = { version = "0.5.1", default-features = false }
mp3lame-encoder = "0.3.0"

[features]
# The registry sandbox and the recording runner, for tests in this and other crates.
testing = []

[dev-dependencies]
tempfile.workspace = true
# The integration tests in tests/ use the sandbox.
windowcraft-engine = { path = ".", features = ["testing"] }

[lints]
workspace = true
