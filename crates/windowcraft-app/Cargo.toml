# Made by ycangignacy
[package]
name = "windowcraft-app"
description = "WindowCraft desktop application and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "windowcraft_app"
path = "src/lib.rs"

# Elevation is requested at runtime, so the binary itself carries no harness.
[[bin]]
name = "windowcraft"
path = "src/main.rs"
test = false

[dependencies]
windowcraft-config.workspace = true
windowcraft-engine.workspace = true
windowcraft-iso.workspace = true
windowcraft-physics.workspace = true
clap.workspace = true
iced.workspace = true
tokio.workspace = true
serde_json.workspace = true
windows.workspace = true
# Not used directly: selects the backends iced's wgpu renderer is built with.
wgpu.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1"
